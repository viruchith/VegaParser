version: "3.8"
services:
  app:
    image: myapp:latest
    environment:
      DATABASE_URL: postgres://user:secret@db:5432/myapp
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
